<!-- src/git_manager/web/templates/ssh/test.html -->
{% extends "base.html" %}

{% block title %}Test SSH Connection - Git Manager{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Test SSH Connections</h2>
    </div>
    <div class="card-body">
        <p>Test SSH connections for all configured accounts to ensure they're working correctly.</p>

        <div class="form-group">
            <label>Select Account:</label>
            <select class="form-control" id="account-select">
                <option value="">Loading accounts...</option>
            </select>
            <button class="btn btn-primary" onclick="testSelectedAccount()" style="margin-top: 10px;">
                Test Connection
            </button>
            <button class="btn btn-secondary" onclick="testAllAccounts()" style="margin-top: 10px;">
                Test All Accounts
            </button>
        </div>

        <div id="test-results" style="margin-top: 30px;"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let accounts = [];

async function loadAccounts() {
    const select = document.getElementById('account-select');
    try {
        accounts = await apiRequest('/api/v1/accounts');
        select.innerHTML = accounts.map(acc => 
            `<option value="${acc.name}">${acc.name} (${acc.platform})</option>`
        ).join('');
    } catch (error) {
        select.innerHTML = '<option value="">Error loading accounts</option>';
    }
}

async function testSelectedAccount() {
    const accountName = document.getElementById('account-select').value;
    if (!accountName) return;
    
    const resultsDiv = document.getElementById('test-results');
    resultsDiv.innerHTML = `
        <div class="test-result">
            <h3>${accountName}</h3>
            <div class="spinner"></div>
            <p>Testing connection...</p>
        </div>
    `;
    
    try {
        const result = await apiRequest(`/api/v1/accounts/${accountName}/test`, 'POST');
        
        resultsDiv.innerHTML = `
            <div class="test-result ${result.success ? 'success' : 'error'}">
                <h3>${accountName}</h3>
                <p class="status">${result.success ? '✓ Connected' : '✗ Connection Failed'}</p>
                <pre>${result.message}</pre>
            </div>
        `;
    } catch (error) {
        resultsDiv.innerHTML = `
            <div class="test-result error">
                <h3>${accountName}</h3>
                <p class="status">✗ Error</p>
                <pre>${error.message}</pre>
            </div>
        `;
    }
}

async function testAllAccounts() {
    if (accounts.length === 0) {
        showNotification('No accounts to test', 'warning');
        return;
    }
    
    const resultsDiv = document.getElementById('test-results');
    resultsDiv.innerHTML = '<h3>Testing all accounts...</h3>';
    
    for (const account of accounts) {
        resultsDiv.innerHTML += `
            <div class="test-result" id="result-${account.name}">
                <h4>${account.name} (${account.platform})</h4>
                <div class="spinner"></div>
                <p>Testing...</p>
            </div>
        `;
        
        try {
            const result = await apiRequest(`/api/v1/accounts/${account.name}/test`, 'POST');
            
            document.getElementById(`result-${account.name}`).innerHTML = `
                <h4>${account.name} (${account.platform})</h4>
                <p class="status ${result.success ? 'success' : 'error'}">
                    ${result.success ? '✓ Connected' : '✗ Failed'}
                </p>
                <details>
                    <summary>Details</summary>
                    <pre>${result.message}</pre>
                </details>
            `;
        } catch (error) {
            document.getElementById(`result-${account.name}`).innerHTML = `
                <h4>${account.name} (${account.platform})</h4>
                <p class="status error">✗ Error</p>
                <pre>${error.message}</pre>
            `;
        }
    }
}

document.addEventListener('DOMContentLoaded', loadAccounts);
</script>

<style>
.test-result {
    padding: 15px;
    margin: 10px 0;
    border-radius: 5px;
    background-color: var(--color-dark);
    border-left: 4px solid var(--color-accent);
}

.test-result.success {
    border-left-color: var(--color-success);
}

.test-result.error {
    border-left-color: var(--color-error);
}

.test-result .status {
    font-weight: bold;
    font-size: 1.1em;
}

.test-result .status.success {
    color: var(--color-success);
}

.test-result .status.error {
    color: var(--color-error);
}

.test-result pre {
    background-color: rgba(0, 0, 0, 0.3);
    padding: 10px;
    border-radius: 3px;
    overflow-x: auto;
}

details {
    margin-top: 10px;
}

details summary {
    cursor: pointer;
    color: var(--color-accent);
}
</style>
{% endblock %}
