<!-- src/git_manager/web/templates/accounts/list.html -->
{% extends "base.html" %}

{% block title %}Accounts - Git Manager{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2>Git Accounts</h2>
        <button class="btn btn-primary" onclick="showAddAccountModal()">Add Account</button>
    </div>
    <div class="card-body">
        <table class="table" id="accounts-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Platform</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated by JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<!-- Add Account Modal -->
<div id="addAccountModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add Account</h3>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <form id="addAccountForm">
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="form-group">
                    <label>Platform:</label>
                    <select class="form-control" name="platform" required>
                        <option value="github">GitHub</option>
                        <option value="gitlab">GitLab</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="form-group">
                    <label>SSH Key Path:</label>
                    <input type="text" class="form-control" name="ssh_key_path" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <input type="text" class="form-control" name="description">
                </div>
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function showAddAccountModal() {
    document.getElementById('addAccountModal').style.display = 'block';
}

function closeModal() {
    document.getElementById('addAccountModal').style.display = 'none';
}

document.getElementById('addAccountForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData);
    
    try {
        await apiRequest('/api/v1/accounts', 'POST', data);
        closeModal();
        loadAccounts();
        showNotification('Account added successfully!', 'success');
    } catch (error) {
        showNotification('Failed to add account', 'error');
    }
});
</script>
{% endblock %}
