name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUST_LOG: info

jobs:
  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup component add rustfmt clippy
          rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/git_manager/target
          key: lint-${{ runner.os }}-${{ hashFiles('v2/git_manager/Cargo.lock') }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Build Zig native layer
        working-directory: v2/git_manager/zig_native
        run: zig build -Doptimize=ReleaseSafe

      - name: cargo fmt
        working-directory: v2/git_manager
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: v2/git_manager
        run: cargo clippy --workspace --all-targets -- -D clippy::all

  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/git_manager/target
          key: test-${{ runner.os }}-${{ hashFiles('v2/git_manager/Cargo.lock') }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Build Zig native layer
        working-directory: v2/git_manager/zig_native
        run: zig build -Doptimize=ReleaseSafe

      - name: cargo test
        working-directory: v2/git_manager
        run: cargo test --workspace

  audit:
    name: Security audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup show

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        working-directory: v2/git_manager
        run: cargo deny check all

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/git_manager/target
          key: build-${{ runner.os }}-${{ hashFiles('v2/git_manager/Cargo.lock') }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0

      - name: Build Zig native layer
        working-directory: v2/git_manager/zig_native
        run: zig build -Doptimize=ReleaseSafe

      - name: cargo build (release)
        working-directory: v2/git_manager
        run: cargo build --release --workspace

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: git-manager-cli
          path: v2/git_manager/target/release/git-manager

      - name: Upload web binary
        uses: actions/upload-artifact@v4
        with:
          name: git-manager-web
          path: v2/git_manager/target/release/git-manager-web
