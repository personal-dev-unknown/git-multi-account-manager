name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            pkg: ".deb"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
            pkg: ".deb"
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            pkg: ".dmg"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            pkg: ".dmg"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup target add ${{ matrix.target }}
          rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/git_manager/target
          key: release-${{ matrix.target }}-${{ hashFiles('v2/git_manager/Cargo.lock') }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.12.0

      - name: Build Zig native layer
        working-directory: v2/git_manager/zig_native
        run: zig build -Doptimize=ReleaseSafe

      - name: cargo build (release)
        working-directory: v2/git_manager
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p dist
          cp v2/git_manager/target/${{ matrix.target }}/release/git-manager${{ matrix.ext }} dist/
          cp v2/git_manager/target/${{ matrix.target }}/release/git-manager-web${{ matrix.ext }} dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-manager-${{ matrix.target }}
          path: dist/

  create-release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release archive
        run: |
          for dir in git-manager-*/; do
            target="${dir%/}"
            tar -czf "${target}.tar.gz" -C "${dir}" .
          done

      - name: Generate release notes
        id: notes
        run: |
          echo "## Git Manager Release ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "### Artifacts" >> release-notes.md
          for f in *.tar.gz; do
            echo "- ${f}" >> release-notes.md
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: "*.tar.gz"
          body_path: release-notes.md
          draft: true
          prerelease: false
