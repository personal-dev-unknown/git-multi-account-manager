[package]
name        = "git-manager"
version     = "0.1.0"
edition     = "2021"
description = "Git Multi-Account Manager — CLI binary"
default-run = "git-zyrix"

# The CLI binary is deliberately thin. Its only job is to wire together every
# concrete adapter (from gm_adapters), every domain service (from gm_domain),
# and the plugin infrastructure (from gm_kernel), then hand control to the
# gm_interface_cli plugin's run() method. No business logic lives here.

[[bin]]
name = "git-zyrix"
path = "src/main.rs"

[dependencies]
# Interface plugin — defines CliPlugin, CliServices, CliServicesHandle
gm_interface_cli = { path = "../../crates/gm_interface_cli" }

# Kernel — bootstrap, Kernel struct, plugin loading
gm_kernel        = { path = "../../crates/gm_kernel" }

# Domain services — AccountService, SshService, etc.
gm_domain        = { path = "../../crates/gm_domain" }

# Ports — inbound commands and outbound trait objects
gm_ports         = { path = "../../crates/gm_ports" }

# Adapters — concrete repositories and Zig-backed providers
gm_adapters      = { path = "../../crates/gm_adapters" }

# Shared — DTOs, error types
gm_shared        = { path = "../../crates/gm_shared" }

# Async runtime
tokio            = { workspace = true }
async-trait      = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }

# Provider plugins — registered in the plugin list at bootstrap
gm_plugin_github       = { path = "../../crates/gm_plugin_github" }
gm_plugin_gitlab       = { path = "../../crates/gm_plugin_gitlab" }
gm_plugin_bitbucket       = { path = "../../crates/gm_plugin_bitbucket" }
gm_plugin_azure_devops    = { path = "../../crates/gm_plugin_azure_devops" }
gm_plugin_sourceforge     = { path = "../../crates/gm_plugin_sourceforge" }
gm_plugin_custom          = { path = "../../crates/gm_plugin_custom" }
gm_plugin_cloud_storage   = { path = "../../crates/gm_plugin_cloud_storage" }
gm_plugin_local_path      = { path = "../../crates/gm_plugin_local_path" }

# Interactive prompts (first-run wizard)
dialoguer        = { workspace = true }
atty             = "0.2"

# Standard library extras
uuid             = { workspace = true }
chrono           = { workspace = true }
serde_json       = { workspace = true }
sqlx             = { workspace = true }
dirs-next        = { workspace = true }

# HTTP client — for remote repo listing via platform APIs
reqwest          = { workspace = true }