<!DOCTYPE html><html><head><title>Add Account</title>
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/components.css">
</head><body>
<nav class="nav"><a class="nav-brand" href="/">Git Manager</a><a href="/accounts">← Accounts</a></nav>
<main><h1>Add Account</h1>
<form method="POST" action="/accounts/new">
  <div class="form-group"><label>Alias</label><input name="alias" placeholder="work" required></div>
  <div class="form-group"><label>Platform</label>
    <select name="platform"><option value="github">GitHub</option><option value="gitlab">GitLab</option>
    <option value="bitbucket">Bitbucket</option><option value="azure_devops">Azure DevOps</option></select>
  </div>
  <div class="form-group"><label>Username</label><input name="username" required></div>
  <div class="form-group"><label>Email</label><input name="email" type="email" required></div>
  <div class="form-group"><label>Auth Method</label>
    <select name="auth_method"><option value="ssh">SSH</option><option value="https_pat">HTTPS PAT</option></select>
  </div>
  <button type="submit" class="btn-primary">Add Account</button>
</form></main></body></html>
